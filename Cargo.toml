[package]
name = "mangad-neon"
version = "0.1.0"
edition = "2024"
authors = ["netsalmon@disroot.org"]
license = "GPL-3"
description = "A comic scraping and background service tool"

[[bin]]
name = "mangad-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "mangad"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
image = { version = "0.25.10", features = ["webp"] }
toml = "1.1.0"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
axum = "0.8.8"
reqwest = "0.13.2"
sea-orm = { version = "1.1.19", features = ["sqlx-postgres", "runtime-tokio", "macros"] }
url = "2.5.8"
webp = "0.3.1"
dotenvy = "0.15.7"
async-trait = "0.1.89"
tokio-retry = { version = "0.3.0" }
uuid = { version = "1.23.0", features = ["v4"] }
rand = "0.10.0"
argon2 = "0.5.3"
chrono = "0.4.44"
paste = "1.0.15"
meilisearch-sdk = "0.32.0"
sqlx-core = "0.8.6"
tokio-util = "0.7.18"
clap = { version = "4.6.0", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio-stream = "0.1.18"
async-stream = "0.3.6"
md-5 = "0.10.6"