[package]
name = "mangad-neon"
version = "0.1.0"
edition = "2024"
authors = ["netsalmon@disroot.org"]
license = "GPL-3"
description = "A comic scraping and background service tool"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = "1.22.0"
image = { version = "0.25.10", features = ["webp"] }
toml = "1.1.0"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
axum = "0.8.8"
reqwest = "0.13.2"
sea-orm = { version = "1.1.19", features = ["sqlx-postgres", "runtime-tokio", "macros"] }
chrono = "0.4.43"
log = "0.4.25"
fern = { version = "0.7.1", features = ["colored"] }
md-5 = "0.10.6"
url = "2.5.8"
fs_extra = "1.3"
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
rand = "0.10.0"
sha2 = "0.11.0-rc.5"
hex = "0.4.3"
clap = { version = "4.5.58", features = ["derive"]}
webp = "0.3.1"
ctor = "0.6.3"
dotenvy = "0.15.7"
async-trait = "0.1.89"
tracing-subscriber = "0.3.23"